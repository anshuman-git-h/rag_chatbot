[project]
name = "rag-krish-naik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishna mahajan", email = "krishnamahajan1207@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
]

[project.scripts]
rag-krish-naik = "rag_krish_naik:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
